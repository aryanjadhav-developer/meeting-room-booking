services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - Database__Provider=SqlServer
      - ConnectionStrings__CabinBooking=Server=sqlserver;Database=CabinBookingDb;User ID=sa;Password=Your_password123!;Encrypt=False;TrustServerCertificate=True
      - Jwt__SigningKey=docker-compose-development-signing-key-0123456789-xyz
      - Demo__Enabled=true
      - Email__SmtpHost=mailpit
      - Email__SmtpPort=1025
    depends_on:
      sqlserver:
        condition: service_healthy
      mailpit:
        condition: service_started

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_password123!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Your_password123!' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
